<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="node-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.4"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <style>
      .pulse-line {
        stroke-dasharray: 8 12;
        animation: dash 30s linear infinite;
      }
      @keyframes dash {
        to { stroke-dashoffset: -1000; }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" fill="url(#bg-grad)" rx="16"/>

  <!-- Dynamic Data Mesh Background Grid & Network Lines -->
  <g opacity="0.35">
    <!-- Mesh Grid Lines -->
    <path class="pulse-line" d="M 100 50 L 300 120 L 500 60 L 700 150 L 900 80 L 1100 180" stroke="#38bdf8" stroke-width="1.5" fill="none"/>
    <path class="pulse-line" d="M 150 250 L 350 180 L 600 240 L 850 170 L 1050 250" stroke="#a855f7" stroke-width="1.5" fill="none"/>
    <path class="pulse-line" d="M 300 120 L 350 180 M 500 60 L 600 240 M 700 150 L 850 170 M 900 80 L 1050 250" stroke="#6366f1" stroke-width="1" fill="none"/>

    <!-- Mesh Nodes -->
    <circle cx="100" cy="50" r="6" fill="#38bdf8"/>
    <circle cx="300" cy="120" r="8" fill="#818cf8"/>
    <circle cx="500" cy="60" r="7" fill="#c084fc"/>
    <circle cx="700" cy="150" r="9" fill="#38bdf8"/>
    <circle cx="900" cy="80" r="6" fill="#818cf8"/>
    <circle cx="1100" cy="180" r="8" fill="#c084fc"/>
    
    <circle cx="150" cy="250" r="7" fill="#a855f7"/>
    <circle cx="350" cy="180" r="6" fill="#38bdf8"/>
    <circle cx="600" cy="240" r="9" fill="#818cf8"/>
    <circle cx="850" cy="170" r="7" fill="#c084fc"/>
    <circle cx="1050" cy="250" r="6" fill="#38bdf8"/>
  </g>

  <!-- Foreground Title and Subtitle -->
  <g text-anchor="middle">
    <!-- Main Title -->
    <text x="600" y="115" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="44" fill="url(#text-grad)" filter="url(#glow)" letter-spacing="1">
      AWESOME DATA MESH PLATFORM
    </text>
    <text x="600" y="115" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="44" fill="url(#text-grad)" letter-spacing="1">
      AWESOME DATA MESH PLATFORM
    </text>

    <!-- Subtitle -->
    <text x="600" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="500" font-size="18" fill="#94a3b8" letter-spacing="0.5">
      Curated Ecosystem of SaaS Platforms, Open-Source Tools &amp; Data Product Frameworks
    </text>

    <!-- Pillar Badges/Pills in Foreground Footer -->
    <g transform="translate(260, 205)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="150" height="34" rx="17" fill="url(#node-grad)" stroke="#38bdf8" stroke-width="1"/>
      <text x="75" y="22" font-family="sans-serif" font-size="12" font-weight="600" fill="#e0f2fe">Domain Ownership</text>

      <!-- Pill 2 -->
      <rect x="175" y="0" width="150" height="34" rx="17" fill="url(#node-grad)" stroke="#818cf8" stroke-width="1"/>
      <text x="250" y="22" font-family="sans-serif" font-size="12" font-weight="600" fill="#e0e7ff">Data as a Product</text>

      <!-- Pill 3 -->
      <rect x="350" y="0" width="150" height="34" rx="17" fill="url(#node-grad)" stroke="#c084fc" stroke-width="1"/>
      <text x="425" y="22" font-family="sans-serif" font-size="12" font-weight="600" fill="#fae8ff">Self-Serve Platform</text>

      <!-- Pill 4 -->
      <rect x="525" y="0" width="155" height="34" rx="17" fill="url(#node-grad)" stroke="#f472b6" stroke-width="1"/>
      <text x="602" y="22" font-family="sans-serif" font-size="12" font-weight="600" fill="#fce7f3">Federated Governance</text>
    </g>
  </g>
</svg>
